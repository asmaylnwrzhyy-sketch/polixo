<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLEX | پولکس</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
        }

        .app {
            max-width: 480px;
            margin: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #f4c542;
        }

        .profile {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #17171b;
            border: 1px solid #f4c542;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .balance {
            background: linear-gradient(135deg, #171717, #111114);
            border: 1px solid #3d3319;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .balance-title {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .balance-value {
            color: #f4c542;
            font-size: 28px;
            font-weight: bold;
        }

        .balance-unit {
            color: #aaa;
            font-size: 13px;
        }

        .main-card {
            background: #151518;
            border: 1px solid #30291a;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            margin-bottom: 16px;
        }

        .wheel {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            margin: 15px auto 20px;
            border: 8px solid #f4c542;
            background:
                conic-gradient(
                    #f4c542 0deg 36deg,
                    #262626 36deg 72deg,
                    #f4c542 72deg 108deg,
                    #262626 108deg 144deg,
                    #f4c542 144deg 180deg,
                    #262626 180deg 216deg,
                    #f4c542 216deg 252deg,
                    #262626 252deg 288deg,
                    #f4c542 288deg 324deg,
                    #262626 324deg 360deg
                );
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(244, 197, 66, 0.15);
        }

        .wheel-center {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #0b0b0d;
            border: 3px solid #f4c542;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .spin-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            background: #f4c542;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-card {
            background: #151518;
            border: 1px solid #30291a;
            border-radius: 17px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
        }

        .menu-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .menu-title {
            font-weight: bold;
            font-size: 14px;
        }

        .menu-subtitle {
            color: #888;
            font-size: 11px;
            margin-top: 5px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #111114;
            border-top: 1px solid #29251b;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px 5px;
        }

        .nav-item {
            text-align: center;
            color: #888;
            font-size: 11px;
        }

        .nav-icon {
            font-size: 21px;
            margin-bottom: 4px;
        }

        .active {
            color: #f4c542;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">POLEX | پولکس</div>
        <div class="profile">👤</div>
    </div>

    <div class="balance">
        <div class="balance-title">موجودی شما</div>
        <div class="balance-value">0</div>
        <div class="balance-unit">تومان</div>
    </div>

    <div class="main-card">

        <h2>🎡 گردونه شانس</h2>

        <div class="wheel">
            <div class="wheel-center">🎁</div>
        </div>

        <button class="spin-button">
            🎡 چرخ
